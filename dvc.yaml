# Historical dvc.lock refers to the pre-M3 experiment. Run dvc repro to refresh.
stages:
  champion:
    cmd: python ml-training/train.py bootstrap --output ml-training/m3-output
    deps:
      - ml-training/train.py
      - ml-training/data_split.py
      - ml-training/check_parity.py
      - ml-training/promotion_gate.py
      - backend/fastapi/app
      - backend/fastapi/tests/fixtures/sample_careers.csv
      - data/cleaned/careers_clean.csv
      - data/cleaned/holdout_v1.json
    params:
      - ml-training/params.yaml:
          - holdout_persona_fraction
          - holdout_seed
    outs:
      - ml-training/m3-output/champion
  train:
    cmd: python ml-training/train.py candidate --output ml-training/m3-output
    deps:
      - ml-training/train.py
      - ml-training/data_split.py
      - ml-training/check_parity.py
      - ml-training/promotion_gate.py
      - backend/fastapi/app
      - backend/fastapi/tests/fixtures/sample_careers.csv
      - data/cleaned/careers_clean.csv
      - data/cleaned/holdout_v1.json
      - ml-training/m3-output/champion
    params:
      - ml-training/params.yaml:
          - random_seed
          - rf_params
          - min_gain
          - holdout_persona_fraction
          - holdout_seed
    outs:
      - ml-training/m3-output/candidate
