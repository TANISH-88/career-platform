name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/fastapi/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/fastapi/requirements.txt ruff

      - name: Catch pin conflicts early (dry-run training requirements)
        run: |
          pip install --dry-run -r ml-training/requirements.txt

      - name: Lint with ruff (syntax and fatal bug rules)
        run: |
          ruff check --select E9,F63,F7,F82 backend/fastapi

      - name: Run pytest
        env:
          GEMINI_API_KEY: dummy
        working-directory: backend/fastapi
        run: |
          pytest tests/ -v

      - name: Run extra-row exclusion tests
        run: |
          pytest ml-training/tests/test_extra_row_exclusion.py ml-training/tests/test_frozen_data.py ml-training/tests/test_promotion_gate.py -v

      - name: Run parity gate (must not skip)
        run: |
          python ml-training/check_parity.py

      - name: M3 champion and candidate verification (isolated registry)
        env:
          MLFLOW_TRACKING_URI: sqlite:///m3-ci.db
        run: |
          python ml-training/train.py bootstrap --register --output "$RUNNER_TEMP/m3"
          python ml-training/train.py candidate --output "$RUNNER_TEMP/m3"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"m3"; c=json.loads((p/"champion/report.json").read_text()); g=json.loads((p/"candidate/report.json").read_text()); assert c["champion_registry"]["version"]=="1"; assert c["legacy_registry"]["version"]=="1"; assert g["gate"]["observed_gain"]==0; assert g["gate"]["promotion_eligible"] is False; assert g["gate"]["parity_passed"]; print("M3 champion and identical candidate verified", c["holdout"]["accuracy"], c["holdout"]["macro_f1"])'

      - name: Upload M3 verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-verification-reports
          path: |
            ${{ runner.temp }}/m3/champion/report.json
            ${{ runner.temp }}/m3/candidate/report.json
          retention-days: 14

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: my-app/package-lock.json

      - name: Install and build
        working-directory: my-app
        run: |
          npm ci
          npm run build

  docker-backend:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -f infra/docker/Dockerfile.backend -t backend:test backend/fastapi

      - name: Report image size
        run: |
          docker images backend:test --format "Image: {{.Repository}}:{{.Tag}} | Size: {{.Size}}"

      - name: Run container
        run: |
          docker run -d --name backend-svc -p 8000:8000 \
            -e GEMINI_API_KEY=dummy \
            -e MLFLOW_ENABLED=false \
            backend:test

      - name: Wait for GET / health check
        run: |
          timeout 30s bash -c 'until curl -s http://localhost:8000/ | grep -q "\"message\":\"Backend running\""; do sleep 1; done'
          echo "Backend health check returned 200 OK with expected JSON"

      - name: Verify POST /predict returns predicted_role
        run: |
          RESPONSE=$(curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"values": [5.0, 7.0, 6.0, 8.0, 6.0, 7.0, 5.0, 8.0, 4.0, 6.0, 7.0, 3.0, 5.0, 6.0]}')
          echo "=== SMOKE TEST RESPONSE ==="
          echo "$RESPONSE"
          echo "==========================="
          echo "$RESPONSE" | grep -q '"predicted_role"' || exit 1
          echo "Prediction smoke test PASSED"

      - name: Stop and cleanup container
        if: always()
        run: |
          docker stop backend-svc 2>/dev/null || true
          docker rm backend-svc 2>/dev/null || true
