name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/fastapi/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/fastapi/requirements.txt ruff

      - name: Catch pin conflicts early (dry-run training requirements)
        run: |
          pip install --dry-run -r ml-training/requirements.txt

      - name: Lint with ruff (syntax and fatal bug rules)
        run: |
          ruff check --select E9,F63,F7,F82 backend/fastapi

      - name: Run pytest
        env:
          GEMINI_API_KEY: dummy
        working-directory: backend/fastapi
        run: |
          pytest tests/ -v

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: my-app/package-lock.json

      - name: Install and build
        working-directory: my-app
        run: |
          npm ci
          npm run build

  docker-backend:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -f infra/docker/Dockerfile.backend -t backend:test backend/fastapi

      - name: Report image size
        run: |
          docker images backend:test --format "Image: {{.Repository}}:{{.Tag}} | Size: {{.Size}}"

      - name: Run container
        run: |
          docker run -d --name backend-svc -p 8000:8000 \
            -e GEMINI_API_KEY=dummy \
            -e MLFLOW_ENABLED=false \
            backend:test

      - name: Wait for GET / health check
        run: |
          timeout 30s bash -c 'until curl -s http://localhost:8000/ | grep -q "\"message\":\"Backend running\""; do sleep 1; done'
          echo "Backend health check returned 200 OK with expected JSON"

      - name: Verify POST /predict returns predicted_role
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"values": [5.0, 7.0, 6.0, 8.0, 6.0, 7.0, 5.0, 8.0, 4.0, 6.0, 7.0, 3.0, 5.0, 6.0]}')
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"predicted_role"' || exit 1
          echo "Prediction smoke test PASSED"

      - name: Stop and cleanup container
        if: always()
        run: |
          docker stop backend-svc 2>/dev/null || true
          docker rm backend-svc 2>/dev/null || true
