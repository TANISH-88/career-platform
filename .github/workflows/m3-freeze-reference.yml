name: M3 freeze champion reference

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/m3-freeze-reference.yml']

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verified Part B commit
        uses: actions/checkout@v4
        with:
          ref: 55572273068bdad19d719149df877d7b00fd01d1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned inference dependencies
        run: pip install scikit-learn==1.7.1 numpy==1.26.4 pandas==2.2.2 joblib==1.4.2 pydantic==2.13.4 pyyaml==6.0.2
      - name: Reproduce and export frozen row-aligned predictions
        run: |
          python - <<'PY'
          import json, sys, pathlib, base64
          sys.path.insert(0, "ml-training")
          from train import CHAMPION_PARAMS, fit_development, evaluate, frozen_identity, ALL_FEATURES
          from data_split import load_frozen_split
          dev, hold = load_frozen_split()
          model, encoder = fit_development(dev, CHAMPION_PARAMS)
          score = evaluate(model, encoder, hold)
          assert abs(score["accuracy"] - 0.1972972972972973) < 1e-12
          assert abs(score["macro_f1"] - 0.16639113268278288) < 1e-12
          reference = {
              "source_commit": "55572273068bdad19d719149df877d7b00fd01d1",
              "identity": frozen_identity(),
              "recipe": CHAMPION_PARAMS,
              "class_order": encoder.classes_.tolist(),
              "holdout_accuracy": score["accuracy"],
              "holdout_macro_f1": score["macro_f1"],
              "row_ids": hold.row_id.tolist(),
              "predictions": model.predict(hold[ALL_FEATURES]).tolist(),
          }
          content = json.dumps(reference, separators=(",", ":"), allow_nan=False)
          pathlib.Path("champion-reference.json").write_text(content + "\n")
          print("M3_REFERENCE_BASE64=" + base64.b64encode(content.encode()).decode())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-champion-reference
          path: champion-reference.json
          retention-days: 14
