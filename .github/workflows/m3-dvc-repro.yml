name: M3 DVC reproduction

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/m3-dvc-repro.yml']

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/fastapi/requirements.txt dvc==3.51.2
      - name: Regenerate lock with DVC
        run: |
          dvc repro --force train
          python -c 'import base64,pathlib; print("M3_DVC_LOCK_BASE64="+base64.b64encode(pathlib.Path("dvc.lock").read_bytes()).decode())'
      - uses: actions/upload-artifact@v4
        with:
          name: m3-dvc-lock
          path: dvc.lock
          retention-days: 14
